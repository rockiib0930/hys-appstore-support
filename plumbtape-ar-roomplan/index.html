<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlumbTape Support</title>
  <style>
    :root { color-scheme: light; --ink: #162d32; --muted: #52676b; --paper: #fffdf7; --amber: #e8a52a; }
    body { margin: 0; background: #f2ead9; color: var(--ink); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }
    article { background: var(--paper); border-radius: 22px; padding: 28px; box-shadow: 0 18px 45px rgba(22,45,50,.1); }
    h1 { font-size: 38px; line-height: 1.1; margin: 0 0 12px; }
    a { color: var(--ink); font-weight: 700; }
    .button { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 14px; background: var(--amber); text-decoration: none; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>PlumbTape Support</h1>
      <p>PlumbTape is an on-device AR room measure and floor-plan app for capturing room corners, calibrating one known distance, checking move-in fit, comparing revisions and exporting a dimensioned PDF.</p>
      <p>Support and privacy contact: <a href="mailto:rockiib@icloud.com">rockiib@icloud.com</a></p>
      <a class="button" href="./privacy/">Read the Privacy Policy</a>
    </article>
  </main>
</body>
</html>
