<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxwright Support and Privacy</title>
  <style>
    :root { color-scheme: light; --ink: #14202a; --muted: #52636b; --paper: #fffdf8; --accent: #ed6d2e; }
    body { margin: 0; background: #f5f0e3; color: var(--ink); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 22px 72px; }
    section { background: var(--paper); border-radius: 22px; padding: 24px; margin: 18px 0; box-shadow: 0 18px 45px rgba(20,32,42,.08); }
    h1 { font-size: 38px; line-height: 1.1; margin: 0 0 8px; }
    h2 { margin: 0 0 12px; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Boxwright</h1>
    <p>Offline 3D packing planner for measured products, cartons, carrier checks and reusable packing sequences.</p>
    <section>
      <h2>Support</h2>
      <p>Questions about setup, local data, purchase restoration or app behavior: <a href="mailto:rockiib@icloud.com">rockiib@icloud.com</a>.</p>
      <p><a href="privacy/">Read the Privacy Policy</a></p>
    </section>
  </main>
</body>
</html>
