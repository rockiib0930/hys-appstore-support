<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeltaPage Support and Privacy</title>
  <style>
    :root { color-scheme: light; --ink: #17352d; --muted: #52675f; --paper: #fffdf8; --accent: #0b6b62; }
    body { margin: 0; background: #f5f1e8; color: var(--ink); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 780px; margin: 0 auto; padding: 48px 22px 72px; }
    section { background: var(--paper); border-radius: 22px; padding: 24px; margin: 18px 0; box-shadow: 0 18px 45px rgba(23,53,45,.08); }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; }
    h2 { margin: 0 0 12px; }
    p, li { color: var(--muted); }
    a { color: var(--accent); font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>DeltaPage</h1>
    <p>Document version comparison, per-change decisions, merged preview, and Markdown export.</p>
    <section>
      <h2>Support</h2>
      <p>Email <a href="mailto:codetea@163.com">codetea@163.com</a>. Include the iOS version, DeltaPage version, and a short description of the issue.</p>
      <p><a href="privacy/">Read the DeltaPage Privacy Policy</a></p>
    </section>
  </main>
</body>
</html>
